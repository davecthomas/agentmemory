[tool.poetry]
name = "agentmemory"
version = "0.5.0"
description = "Collaborative shared repo memory for fast-moving software work — helps people, agents, and teams stay aligned by capturing why decisions were made, what changed, and what comes next in plain Markdown in Git."
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
# black is pinned to an exact version: its formatting output changes between
# releases, so a caret range lets `poetry update` reformat the tree and turn the
# next unrelated PR into a formatting diff. Raise this pin in its own commit.
black = "25.12.0"
ruff = "^0.11"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (line too long) is delegated to Black, which does not reformat docstrings.
# Suppressing here avoids false positives on long docstring lines.
ignore = ["E501"]
